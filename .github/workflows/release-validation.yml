name: Release validation

on:
  push:
    branches:
      - release/**
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transactx_disposable_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transactx_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/transactx_disposable_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply migrations
        run: for migration in backend/migrations/*.up.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Test
        working-directory: backend
        run: go test -count=1 ./...
      - name: Race test
        working-directory: backend
        run: go test -race -count=1 ./...
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Dedicated Disposable Database Lifecycle (Cross-Bank & Crash Matrix)
        run: bash backend/scripts/run-cross-bank-disposable.sh --base-url "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
